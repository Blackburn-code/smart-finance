name: Bina APK Smart Finance

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kod
        uses: actions/checkout@v4

      - name: Sediakan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sediakan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang pakej
        run: npm install

      - name: Tambah platform Android
        run: npx cap add android

      - name: Jana ikon aplikasi
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0E6B5A' --iconBackgroundColorDark '#0E6B5A' --splashBackgroundColor '#0E6B5A' --splashBackgroundColorDark '#0D1412'

      - name: Salin fail web ke Android
        run: npx cap sync android

      - name: Bina APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Namakan semula APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SmartFinance.apk

      - name: Muat naik APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SmartFinance-APK
          path: SmartFinance.apk

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Smart Finance v1.0.${{ github.run_number }}
          body: APK Smart Finance. Muat turun SmartFinance.apk dan pasang di telefon Android.
          files: SmartFinance.apk
